description: >-
  How do you turn a film, character, brand or idea into an experience people
  can take part in? In this hands-on workshop, Emma Barbato guides
  participants through a simple process for creating an interactive world:
  what the audience sees, what they can choose, what changes because of those
  choices and what the experience should remember.


  No coding or technical knowledge is required. Participants will take an
  idea of their own and shape it into a practical interactive-world blueprint
  using the thinking behind GenFlix Worlds used in The Bruce Ryder Show. Come
  with an idea. Leave knowing how to turn it into an experience people can
  explore, shape and remember.
