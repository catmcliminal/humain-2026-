hook: Three practitioners, three bets on what AI does to creative work.
description: >-
  AI has made it effortless to make almost anything. The optimists call this the
  great equaliser; the sceptics call it the beginning of a sameness crisis.


  This session puts three people who've staked their businesses on very
  different answers to this question on the same stage to duke it out.


  The promise: AiCandy (Kent Boswell). Australia's first AI film studio on how
  AI removes the budget ceiling and lets any brand make the impossible. The case
  for amplification: bigger ideas, made by more people, than ever before.


  The field report: Marie-Céline Merret Wirström, MC&V. What 1,000 award entries
  across 45 countries actually reveal: that the best work still comes from
  judgment and craft, not from doing everything yourself.


  The machine operator: Pip Bingemann, Springboards. The ex adland founder of a
  startup building a divergent-thinking LLM on why fluency fools smart people,
  why models hit a hard creativity ceiling, and why "good enough" invisibly
  engineers distinctiveness out of the work. The case from inside the machine
  for keeping your judgment, taste and edge.


  The discussion. If everyone can make anything, is the result more creativity
  or just more of the same?


  Moderated by humAIn's Cat McGinn, this will be an impassioned debate on the
  current state and future trajectory of creative, asking tough questions and
  setting a provocation to the industry.
