name: Sneha Rathod
role: Head of AI Capabilities & Solutions, SBS
photo: /images/speakers/sneha-rathod/photo.jpg
bio: >-
  Sneha Rathod is Head of AI Capabilities & Solutions at SBS, where she leads
  the organisation's AI Program across governance, policy, enterprise-wide
  solutions, content and distribution, and education. She works to ensure AI
  use across one of Australia's most linguistically and culturally diverse
  media organisations strengthens, rather than undermines, audience trust and
  representation.


  With over 15 years' experience spanning digital product management, business
  analysis, and AI innovation across media, retail, and financial services,
  Sneha has led large-scale platform migrations, incubated AI pilots into
  enterprise-wide solutions, and built the cross-functional collaboration
  needed to embed AI capability responsibly into complex organisations. Her
  work sits at the intersection of technology, governance, and culture,
  translating AI strategy into practical frameworks that teams can actually
  use.
