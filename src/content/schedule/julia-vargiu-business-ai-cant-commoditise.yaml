title: 'Build a Business AI Can''t Commoditise: What Buyers Will Value in Three Years'
day: '2026-10-14'
stage: Workshop
speaker: Julia Vargiu, Director Australia, SI Global
photos:
  - /images/speakers/julia-vargiu/photo.jpg
description: >-
  AI can improve margins, accelerate delivery and create new products. It can
  also commoditise capabilities, flatten differentiation and make a business
  easier to replicate or price down. In this practical workshop, leaders of
  agencies, consultancies, SaaS and technology-enabled businesses will assess
  where AI is increasing enterprise value, where it may be eroding it, and what
  will remain genuinely defensible in three years. Drawing on global, regional
  and Australian deal activity, participants will examine the questions
  increasingly being asked by investors, private equity firms and strategic
  buyers, and leave with a clearer view of what to strengthen, redesign or stop
  relying on — and how judgment, trust, creativity, relationships and sector
  expertise can become more valuable as production gets easier.
