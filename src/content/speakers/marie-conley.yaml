name: Marie Conley
role: Executive Strategy Director, APAC, R/GA
photo: /images/speakers/marie-conley/photo.jpg
bio: >-
  As APAC Executive Director of Strategy at R/GA, Marie sets the direction that
  helps brands succeed in the age of AI, creating new ways of working for both
  the company and its clients.

  Marie has always worked across different strategic disciplines. Prior to
  joining R/GA, Marie worked at The Pharm, a global WPP shop that wasn't just
  multi-disciplinary, it was multi-agency. Creative from VML, PR from Ogilvy,
  tech from Wunderman Thompson and media from EssenceMediacom – all working as
  one agency for the global health and beauty brand, Walgreens Boots Alliance.

  Prior to that, Marie was Head of Strategy at TBWA London, where she helped
  build out the agency's Disruption approach, linking the data studio and design
  studio to create award-winning work across sport, fashion, technology and
  gaming. Marie has won both APG and Effie awards, because her ambition has
  always been strategy that actually works.

  Before her 20 years as a strategist, Marie started her career as a graphic
  designer, having graduated from Visual Communication at UTS before completing
  a Master of Commerce at the University of Sydney.
