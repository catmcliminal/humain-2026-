description: >-
  your team lives on screens. slack. zoom. figma. notion. attention fragments.
  creativity narrows. and somewhere along the way, the genuinely human gets
  quietly crowded out.


  Screen Swap is a screen printing workshop created in response to one of the
  defining cultural shifts of our time. organisations are actively looking for
  ways to genuinely reconnect their teams beyond the usual team day agenda.


  at this session, participants swap their digital screen for a printmaking
  screen, choose a colour, and print their own item to take home. no prior
  experience needed. just eco-friendly ink, linen, and your own two hands. no
  training required. Every participant leaves with a screen printed piece they
  made themselves.
