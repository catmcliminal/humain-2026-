name: Dave King
role: Co-founder, Radical Intelligence
photo: /images/speakers/dave-king/photo.png
bio: >-
  Dave King is co-founder of Radical Intelligence, an AI-native transformation
  company that builds radical AI capability inside organisations across
  Australia and APAC. He has been building AI products and systems since 2017,
  working across creative industries, legal, finance, property and more.

  Prior to Radical Intelligence, Dave founded The Royals, an independent
  creative agency with clients including Spotify, Qantas, Mercedes-Benz and
  AustralianSuper. He is an Adjunct Assistant Professor at Deakin University and
  has spoken at TEDx, SXSW and Vivid Sydney and others.
