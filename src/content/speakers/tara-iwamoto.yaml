name: Tara Iwamoto
role: Co-founder, Vibe Coding Lab
photo: /images/speakers/tara-iwamoto/photo.jpg
bio: >-
  Tara Iwamoto is the co-founder of Vibe Coding Lab, a community that teaches
  women and underrepresented builders to make real things with AI, no coding
  experience required. At the last event, 30 women shipped working apps in a
  single afternoon, and the day scored 9.2 out of 10.

  She brings 12 years of operations and creative leadership to the work. She
  has led delivery across four APAC markets at Google, run a content studio
  at POPSUGAR Studios that she scaled from 20 people to over 100, and held
  senior roles at WPP and oOh!Media. She now runs her own operations
  consultancy.

  Her interest in vibe coding grew sharper when she noticed she was usually
  one of only two women in the room at these workshops. That made her mad
  enough to do something about it, and Vibe Coding Lab is what she built.
