name: Lucinda Barlow
role: Head of International Marketing, Uber
photo: /images/speakers/lucinda-barlow/photo.jpg
bio: >-
  Lucinda leads Uber's International Marketing team, overseeing over 60
  countries across APAC, EMEA, and LATAM. She drives cross-market synergy while
  strengthening Uber's local presence — scaling go-to-market strategies,
  elevating global marketing capabilities, and fostering bold creativity and
  innovation. Prior to this, she was Head of Marketing APAC.

  Under her leadership, Uber has launched award-winning campaigns, including
  Tonight I'll Be Eating, Get Almost Almost Anything, and When You've Done
  Enough.

  Before Uber, Lucinda led global consumer and product marketing for YouTube in
  California, helping grow its user base to two billion daily users. She built
  YouTube's product marketing function, launched its ad-supported original
  content, and scaled YouTube's Culture & Trends operation worldwide. Prior to
  that, she spent seven years leading Google's marketing and communications in
  Australia and NZ, shaping the brand, supporting businesses online, and
  spearheading key partnerships.

  With 25+ years of experience across tech, media, internet, and mobile across
  APAC, Lucinda has held leadership roles at Symbian, where she led global
  marketing and built the company's first China office. She has also worked in
  two internet startups and began her career as a mission-critical systems
  engineer at BHP.

  Lucinda holds first-class honours degrees in Electrical Engineering and
  Computer Science and an MBA from INSEAD. She now lives in Bronte Beach,
  Sydney, with her husband and three children.
