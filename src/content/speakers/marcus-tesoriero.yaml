name: Marcus Tesoriero
role: Co-Founder, Head of Creative, AiCandy
photo: /images/speakers/marcus-tesoriero/photo.jpg
bio: >-
  Marcus is an award-winning creative leader with extensive experience building
  brands at some of the world's leading integrated agencies, including Ogilvy,
  DDB and Dentsu Creative. Beyond filmmaking, his career has spanned a range of
  specialised marketing disciplines, giving him deep expertise across mobile,
  social, data, PR, health, commercial architecture and AI.

  His work has been recognised at every major creative and effectiveness award
  show globally, including D&AD, One Show, Clio, LIA, the Effies, London IPA
  for Effectiveness, Spikes and Cannes Lions. As Co-Founder of AiCandy, Marcus
  now combines creative excellence and craft with commercially-driven thinking
  to push the frontier of AI filmmaking, making impossible ideas possible for
  brands of every size.
