name: Bronwyn Heys
role: Chief Marketing Officer, Zambrero
photo: /images/speakers/bronwyn-heys/photo.jpg
bio: >-
  Bronwyn Heys is Chief Marketing Officer of Zambrero, a global modern Mex
  restaurant brand, leading customer and growth strategy across markets.
  Zambrero was founded in Australia, with a mission to help end world hunger
  through its Plate 4 Plate initiative.


  Bronwyn is a global marketing leader, board director and senior adviser with
  more than 30 years' experience transforming brands and businesses. Her career
  spans quick service restaurants, retail and fast-moving consumer goods, with
  deep expertise in brand strategy, innovation, customer experience, digital
  plus AI transformation and team capability. She is known for brand
  reinvention and for turning consumer insight into commercially successful
  products, services and communications.


  Her career includes senior leadership roles as Global Brand Director for KFC,
  Chief Marketing Officer of Yum! Brands Canada, Marketing and Menu Director at
  McDonalds Australia, and Chief Marketing Officer at Mars Food Australia. She
  has worked across Australia, North America, Europe, Africa and Asia, and with
  brands including KFC, Taco Bell, Pizza Hut, McDonalds, Mars, Kelloggs, Tip Top
  and The Smiths Snackfood Company.


  Before joining Zambrero, Bronwyn was CEO of the Australian Marketing Institute,
  where she led the organisation's commercial transformation and strengthened
  its focus on professional capability, standards and AI readiness. She is a
  Graduate of the Australian Institute of Company Directors (GAICD), a Fellow
  and Life Member of the Australian Marketing Institute (FAMI) and a Certified
  Practising Marketer (CPM). She is passionate about building enduring brands,
  developing future-ready marketing teams and ensuring marketing remains a
  powerful driver of commercial growth.
