description: >-
  Learn how human-AI cognition is changing consumer behaviour, and how to
  redesign the path to purchase. Humans have forever navigated a world of
  outsourcing stuff we do to technology. Most often we focus on technology
  helping with things we do, but it also helps us with how we think. Everything
  from calculators, to clocks to notepads outsource some form of cognitive
  process - called 'extended cognition'. Now that Artificial Intelligence is
  here and everyone has their favourite LLM, the world of consumption,
  marketing and brands is about to be forever changed. Here comes System 3.
  System 3 is a hybrid kind of cognition where human and ai work together. In
  this session we're going to pull apart the world of consumer psychology and
  artificial intelligence to show you how brands need to start thinking about
  the role of System 3 in the path to purchase.
