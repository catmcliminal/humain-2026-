name: Adam Krass
role: Product Lead, Mutinex
photo: /images/speakers/adam-krass/photo.jpg
bio: >-
  Adam has spent 20 years turning marketing data into growth decisions for
  some of Australia's largest retail, quick-service restaurant and financial
  services brands. He now leads MAITE, the agents inside Mutinex's GrowthOS
  that turn commercial models into growth answers on demand: ask what drives
  growth and where the next investment returns most, and get the answer in
  minutes.


  At Omnicom he led customer data and loyalty strategy for retail and QSR
  brands, helping them personalise at scale and grow digital-led sales. As
  Chief Digital, Data and Technology Officer at UM he led analytics across
  Australia and an offshore hub, putting marketing mix models and machine
  learning behind customer investment decisions. He started in data-driven
  marketing at eBay, helping Australian retailers win a bigger share of the
  online wallet.
