description: >-
  Bridget will argue that AI is mostly discussed in this industry as a threat
  to jobs, fees and craft. As Co-founder and CEO of BRX, she puts the case for
  AI as a growth story. Drawing on BRX's own work, she shows how AI is changing
  the way creative problems get solved. It also takes on the production and
  administrative work that has built up inside creative roles, and makes new
  revenue possible for agencies. She is direct about where BRX draws the line,
  and about what it takes for the gains to reach the people who do the work.


  Counter position: Tea Uglow is a Peabody-winning creative leader who spent 17
  years building Google’s Creative Lab and now helps AI start-ups understand themselves. During
  her career she worked with cultural orgs, artists, writers, and musicians
  building works at the intersection of emerging technology and culture. Their
  first, early experiments with  AI-driven experiences were in 2017 which is
  when she also began to write about why we should probably worry.


  She has been a critic, an advocate, a doomer, and a utopian AI evangelist, -
  because it is incredibly hard to work out if AI is a good thing or not.


  Her thesis - if you want to skip out early - is that we will probably never
  know but in the meantime we need to be vigilant about what we us AI for, know
  why we are using Ai, and to protect what we want to protect.


  Sometimes the only way to win is not to play, or, at least, to ignore it for a
  bit.
