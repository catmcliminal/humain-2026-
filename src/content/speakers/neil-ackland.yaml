bio: >-
  Neil Ackland is a serial entrepreneur having founded multiple successful
  companies, most notably Sound Alliance, inthemix and Junkee Media, one of
  Australia’s most awarded digital publishers, before its sale to ASX-listed
  oOh!media in 2017. Following the sale, he joined oOh!’s executive team as CMO
  and launched reo, its retail media arm. His career has been spent helping
  people discover the things they love, across media, creators, publishers and
  retail media. He co-founded Lokol in late 2025.
