name: Megan Ormsby
role: Leads communications, Amazon Devices & Services
photo: /images/speakers/megan-ormsby/photo.jpg
bio: >-
  Megan Ormsby leads communications for Amazon’s Devices & Services, the
  company’s consumer innovation division, with a focus on driving public
  understanding of Amazon’s AI-powered devices and digital experiences with a
  customer-first mindset.


  Megan has spent her career working for transformative technology businesses,
  helping shape how emerging technologies are understood, trusted, and adopted.


  Megan is passionate about the role AI can play in improving people’s lives and
  ensuring this transformative technology is communicated in ways that are
  accessible, relevant, and grounded in real-world experiences.
