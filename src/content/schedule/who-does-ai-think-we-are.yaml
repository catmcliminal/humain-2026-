description: >-
  AI generates the statistically probable, not necessarily an accurate
  reflection of the world. As AI becomes embedded in marketing, the brands that
  treat this as a creative and commercial problem, not just an ethical one,
  will outperform those that don't. Drawing on Dove's pioneering work,
  including the localised Whole Body campaign that proved inclusive creative
  drives engagement, and the UN Women Unstereotype Alliance's 3Cs Playbook,
  launching in Australia at this session, this panel explores how marketers can
  recognise bias in AI-generated outputs, challenge default assumptions baked
  into training data, and build AI-enabled marketing that better reflects the
  diversity of the customers they serve.
