name: Vinne Schifferstein
role: Strategy & Partnerships, MC&V
photo: /images/speakers/vinne-schifferstein/photo.jpg
bio: >-
  For over two decades, Vinne Schifferstein has built production companies
  balancing creative ambition with commercial reality. Trained in Marketing,
  Media Economics, and Law, she's led businesses across four countries from
  Publicis and Omnicom to startups. At Monks, she co-founded the ANZ
  operation and delivered global production for BMW across 29 markets.

  Her AI approach is business-focused: after seeing ChatGPT's client impact,
  she completed MIT's AI program and built production capabilities at MADE
  THIS Clemenger BBDO. A former marketer herself, she translates production
  complexity into business outcomes.

  At MC&V, Vinne leads strategy, partnerships, and delivery ensuring every
  project is commercially sound and operationally flawless.
