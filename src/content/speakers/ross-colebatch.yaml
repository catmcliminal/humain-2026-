name: Ross Colebatch
role: Executive Producer, Photoplay Photography
photo: /images/speakers/ross-colebatch/photo.jpg
bio: >-
  As an Executive Producer at Photoplay Photography, Ross works with
  photographers, filmmakers, agencies and brands to bring creative ideas to
  life across advertising, digital, television and live experiences. With a
  background spanning production, digital strategy, marketing and the arts,
  Ross specialises in turning ambitious creative concepts into practical,
  deliverable productions. His perspective bridges the gap between creative
  vision and real-world execution, making him uniquely placed to discuss what
  it takes to get great ideas over the line, on time, on budget, and without
  compromising the work.
