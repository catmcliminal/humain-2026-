name: Marie-Céline Merret
role: Creative Director, MC&V
photo: /images/speakers/marie-celine-merret/photo.jpg
bio: >-
  Marie-Céline Merret identified the commercial potential of AI in production
  early and has spent the past two years proving it under real agency
  conditions. Her career spans experiential design and creative technology at
  Fake Love NYC (A New York Times Company), delivering global work for Google,
  Samsung, Lexus and 7Up, co-founding Monks ANZ, and leading AI-native
  production as Head of Creative Technology & AI at MADE THIS Clemenger BBDO.

  With a foundation in creative technology, digital production and experiential
  design, MC brings rare fluency across code and craft. At MC&V, MC leads
  creative direction and production, curating specialist AI artists globally to
  deliver emotionally resonant work that ships on time, on budget, and to brand
  and business objectives.
