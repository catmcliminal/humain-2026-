bio: >-
  Jeremy Somers is the founder of Not Content, an AI creative agency working at
  the frontier of what AI makes possible in brand and creative work. Before
  that, he founded We Are Handsome, the cult Australian fashion label that
  pioneered digital-first fashion globally, and spent years as a creative at
  agencies.

  Jeremy brings a rare combination of founder instinct, creative craft and
  first-hand experience building with AI tools — making him one of the most
  practical and provocative voices on what AI actually means for creative work.
