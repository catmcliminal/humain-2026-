description: >-
  For decades, some of the best ideas never made it past the page: too
  expensive, too ambitious, too difficult to produce. AI is changing that,
  giving creatives the ability to realise work that once belonged in the
  bottom drawer.


  But removing the production constraint doesn't remove the need for
  judgement. AiCandy co-founders Kent Boswell and Marcus Tesoriero explore
  what happens when imagination is no longer limited by budget, and why
  experience, taste, direction and craft become even more valuable when
  machines can make almost anything.
