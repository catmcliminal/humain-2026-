name: Marie Dowling
role: Founder, Gust PR
bio: >-
  Marie Dowling is the founder of Gust PR, an AI PR platform for nimble
  marketing and modern creatives. After a decade in public affairs and PR, she
  noticed the PR industry kept on automating the wrong thing: more pitches,
  faster, to more journalists already drowning in slop... She became obsessed
  with how to use AI for good stories, attention and journalists' sake.


  Marie also hosts Friday Viibe, an AI community for marketers and comms pro to
  come experiment with AI. She's based in Sydney.
