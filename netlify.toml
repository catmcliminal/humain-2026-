[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.mailerlite.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://api.web3forms.com https://api.github.com https://github.com https://assets.mailerlite.com https://static.mailerlite.com; worker-src 'none'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Route Keystatic admin and API to the SSR function
[[redirects]]
  from = "/keystatic"
  to = "/.netlify/functions/ssr"
  status = 200

[[redirects]]
  from = "/keystatic/*"
  to = "/.netlify/functions/ssr"
  status = 200

[[redirects]]
  from = "/api/keystatic/*"
  to = "/.netlify/functions/ssr"
  status = 200
