name: Celia Harding
role: Founder, LEOPRD
photo: /images/speakers/celia-harding/photo.jpg
bio: >-
  Celia Harding is the Founder of LEOPRD, the world's first agency helping
  brands understand and influence how they show up in AI - building reputation,
  driving recommendation and unlocking growth.

  Launching in April 2025, LEOPRD works with brands locally and
  internationally, including Amazon, TUI, ODEON Cinemas Group, and National
  Dental Care.

  With 20 years of PR and communications experience, Celia is known for her
  sharp cultural instincts and commercial focus. She has launched Series A
  funding rounds, promoted global music collaborations, produced
  record-breaking live streams, and has led social and political movements that
  shaped public conversation.

  Previously, Celia founded PR Shed, a subscription PR platform that
  democratised publicity for startups and scaleups. Through LEOPRD, she helps
  brands be the answer - found, featured, and talked about by both humans and
  machines.

  LEOPRD is Provoke Media's Best New Agency Asia-Pacific 2026, and Celia is
  Mumbrella's PR Professional of the Year and B&T's Women Leading Tech Winner
  2026.
