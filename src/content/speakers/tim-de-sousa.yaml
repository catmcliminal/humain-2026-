name: Tim de Sousa
role: Partner; Co-founder – Sabirus Advisory
photo: /images/speakers/tim-de-sousa/photo.jpg
bio: >-
  Tim de Sousa brings more than 20 years of experience in privacy, information
  governance, digital transformation and regulatory compliance across the
  public and private sectors.

  Tim is a trusted advisor who combines deep technical expertise with practical
  and strategic advice to help organisations navigate complex privacy,
  governance and technology challenges. He works with government and corporate
  clients to strengthen compliance, manage risk, enable digital transformation
  and build trust with customers, stakeholders and the community.

  Prior to co-founding Sabirus Advisory, Tim held senior leadership roles in
  consulting, financial services and government, including with FTI Consulting,
  Westpac, the Commonwealth Bank, the NSW Government and the Office of the
  Australian Information Commissioner. He has advised leading Australian and
  international organisations on privacy, information governance, regulatory
  compliance and emerging technologies. Tim was recognised in the Apolitical/World
  Economic Forum ‘Agile 50’ and is the recipient of the 2025 IAPP Privacy
  Vanguard Award (Oceania).
