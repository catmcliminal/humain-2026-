bio: >-
  Annie Liao is the founder and CEO of Build Club, the company behind Solaris,
  an AI adoption platform helping enterprises become AI-native. What started as
  a global community of 70,000+ AI builders across 60+ cities has evolved into
  a platform for enterprise AI transformation, combining diagnostics, upskilling,
  champion programs and ROI tracking.

  Annie was named in Forbes Australia 30 Under 30 for her work making AI more
  accessible.
