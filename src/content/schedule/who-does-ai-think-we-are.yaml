title: Who Does AI Think We Are?
day: '2026-10-13'
hook: >-
  AI generates the statistically probable, not necessarily an accurate
  reflection of the world.
themes:
  - culture
sessionType: Panel
speaker: >-
  Sam Turley, Invention Lead, Mindshare; Kate Westgate, Head of Marketing -
  Homecare, Unilever; and Annie Konieczny, Australia National Chapter Lead -
  Unstereotype Alliance, UN Women
photos:
  - /images/speakers/sam-turley/photo.jpg
