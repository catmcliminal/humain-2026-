description: >-
  The biggest con in AI right now isn't a scam. It's a seduction. AI sounds
  authoritative, looks polished, and moves fast enough to bypass critical
  thinking.


  Pip Bingemann founded Springboards and is building a model for divergent
  thinking. Using the psychology, the research and the maths the hype skips
  over, he'll show why fluency fools smart people, why models fail up to 10x
  more often on the work that actually matters, and why tools designed to
  make us more productive are invisibly engineering distinctiveness and
  effectiveness out of the work. Pip will argue that we're sleepwalking into
  a "Sameness Crisis," hiding inside the productivity boom.


  You'll leave with the language, the proof and the permission to slow down,
  plus practical ways to use AI without surrendering your judgment, taste or
  edge. Because "good" isn't good enough when "decent" is free.
