bio: >-
  Ben Cooper is an innovation and creative leader who has spent his career
  exploring what happens when technology changes the rules.

  He is the founder of Brainstrust, where he helps organisations turn emerging
  technology into practical advantage, and Last Friday, a community bringing
  together people working at the edges of creativity, technology and
  entrepreneurship.

  Previously, Ben led AI Products at R/GA and innovation at M&C Saatchi,
  creating new products, ventures and capabilities for organisations including
  Uber, Lexus, Google, NRMA and Optus. His work includes the Cannes Lions
  Titanium-winning Clever Buoy and NRMA Fireblanket, and has been recognised by
  D&AD, Cannes Lions and the Australian Financial Review.

  Ben also leads research into AI and creativity with D&AD, examining how
  artificial intelligence is changing creative work, judgement and leadership -
  and what humans need to protect as the technology gets better. His current
  work asks a simple question: as AI removes friction from making things, where
  does human judgement get built?
