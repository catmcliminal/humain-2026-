name: Luke Burton
role: AARON Award-winning filmmaker, editor, composer and multimedia artist
photo: /images/speakers/luke-burton/photo.jpg
bio: >-
  Luke Burton is an AARON award winning filmmaker, editor, composer, and
  multimedia artist with 30 years of experience, now pioneering generative AI
  in creative production. Since 2020, he has combined expertise in direction,
  cinematography, composition, sound design, and editorial craft with AI
  workflows, and created recent campaigns for Uber, Crocs, Lenovo, AMD, and
  Cadbury.


  Burton now helps brands integrate GenAI, demonstrating how traditional
  production skills — direction, camera movement, editing rhythm, music
  composition, audio design — converge with AI's incredible speed and
  flexibility to unlock imaginative work at scale.
