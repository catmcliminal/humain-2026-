[build]
  publish = "dist"
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect.facebook.net / snap.licdn.com are the Meta Pixel and LinkedIn
    # Insight Tag loaders (see src/components/TrackingPixels.astro) — without
    # them in script-src the pixels are blocked and report nothing. Their
    # beacons go out as images, which img-src https: already allows.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://assets.mailerlite.com https://www.googletagmanager.com https://connect.facebook.net https://snap.licdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://static.mailerlite.com https://*.mailerlite.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.youtube.com https://player.vimeo.com https://assets.mailerlite.com https://*.mailerlite.com; connect-src 'self' https://api.web3forms.com https://api.github.com https://github.com https://assets.mailerlite.com https://static.mailerlite.com https://www.google-analytics.com https://www.googletagmanager.com https://www.facebook.com https://px.ads.linkedin.com; worker-src 'none'"

[[headers]]
  for = "/keystatic*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/api/keystatic/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect retired duplicate landing page to homepage
[[redirects]]
  from = "/ai-conference-sydney"
  to = "/"
  status = 301

[[redirects]]
  from = "/ai-conference-sydney/*"
  to = "/"
  status = 301

# The AiCandy session was renamed "The Return of Big Ideas", and the file name
# is the URL, so the old path keeps working.
[[redirects]]
  from = "/programme/aicandy-when-anything-is-possible"
  to = "/programme/return-of-big-ideas"
  status = 301

[[redirects]]
  from = "/programme/aicandy-when-anything-is-possible/*"
  to = "/programme/return-of-big-ideas"
  status = 301

# The AWARD panel was retitled "Bridging the Missing Rung", and the file name
# is the URL, so the old path keeps working.
[[redirects]]
  from = "/programme/award-human-direction"
  to = "/programme/bridging-the-missing-rung"
  status = 301

[[redirects]]
  from = "/programme/award-human-direction/*"
  to = "/programme/bridging-the-missing-rung"
  status = 301

# Route Keystatic admin and API to the SSR function
[[redirects]]
  from = "/keystatic"
  to = "/.netlify/functions/ssr"
  status = 200

[[redirects]]
  from = "/keystatic/*"
  to = "/.netlify/functions/ssr"
  status = 200

[[redirects]]
  from = "/api/keystatic/*"
  to = "/.netlify/functions/ssr"
  status = 200
