bio: >-
  Annie Konieczny is a purpose-led communications and advocacy leader working
  at the intersection of gender equality, culture and influence. She leads the
  Unstereotype Alliance in Australia, convened by UN Women, bringing together
  leading brands, agencies and industry bodies to challenge harmful
  stereotypes and advance inclusive representation across advertising, media
  and marketing. A lawyer by training, Annie is passionate about the power of
  storytelling to shift culture and create meaningful change at scale.
