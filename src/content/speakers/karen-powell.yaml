name: Karen Powell
role: 'Founder & CEO, Omnipresence'
photo: /images/speakers/karen-powell/photo.jpg
bio: >
  Karen Powell is a commercial and operational leader who partners with founders
  of tech, SaaS and creative services businesses to turn complexity into
  investable growth. Over 20+ years she has helped scale B2B and media‑adjacent
  companies across APAC, integrating acquisitions, rebuilding revenue engines
  and preparing businesses for capital events. She founded Omnipresence, a GTM
  and Sales AI advisory, and previously built and exited an AI‑enabled sales
  platform developed in collaboration with major cloud platforms. Karen is also
  a cotutelle PhD candidate researching AI‑mediated B2B buying and how AI
  reshapes the relationships between agencies, platforms, publishers and brands.
  She spoke at humAIn 2024 on trust, deepfakes and “AI as media’s
  extinction‑level event”, and now serves on the humAIn Advisory Panel.
