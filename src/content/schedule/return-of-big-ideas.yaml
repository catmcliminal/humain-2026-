title: The Return of Big Ideas.
day: '2026-10-13'
hook: Making the Impossible with AI.
themes:
  - creative
  - taste
speaker: Kent Boswell and Marcus Tesoriero, co-founders, AiCandy
photos:
  - /images/speakers/kent-boswell/photo.jpg
  - /images/speakers/marcus-tesoriero/photo.jpg
description: >-
  For decades, big ideas in advertising have slowly been squeezed out, deemed
  too expensive, too ambitious or simply impossible to produce. AI is changing
  all that. In the right hands, AI filmmaking is giving brands and agencies the
  ability to realise work that was once banished to the bottom drawer.


  But removing traditional production constraints doesn’t remove the need for
  judgement. Kent and Marcus will share insights from the frontline of
  commercial AI filmmaking, demonstrating why a deep background in creativity,
  storytelling and filmmaking craft matters more than ever.


  They’ll explain what the technology can genuinely do, where it still falls
  short and why great storytelling, direction and craft still require thousands
  of human decisions to create a film that truly stands out on the world stage.


  Most importantly, they’ll show how AI is changing the relationship between
  creative ambition and production cost. When spectacular worlds, characters
  and stories are no longer reserved for the biggest budgets, creativity
  becomes the great equaliser, allowing any brand to think bigger, push ideas
  further and make the impossible.
