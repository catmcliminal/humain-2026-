name: Lauren Joyce
role: Founder, Gun For Hire
bio: >-
  Lauren Joyce is the founder of Gun For Hire, an executive growth consultancy
  that primarily helps CEOs and CMOs at consumer brands operate like media
  companies. She spent two decades leading media and creative agencies, most
  recently as Chief Audience & Content Officer at ARN, where she ran content
  strategy, podcasting and audience growth across the network's national
  portfolio. At humAIn, Lauren presents AdLab on behalf of Abe's Audio: and
  shows how AI is transforming commercial audio production without losing the
  creative talent behind it.
