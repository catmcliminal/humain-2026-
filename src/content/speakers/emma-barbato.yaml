name: Emma Barbato
role: Creative Director, Hyperfiction Magazine
photo: /images/speakers/emma-barbato/photo.jpg
bio: >-
  Emma Barbato is a Creative Director, keynote speaker, and architect of AI
  storytelling known as hyperfiction. As the creator of Bruce Ryder,
  Australia's first AI Celebrity and winner of Best AI Influencer 2025 at the
  Australian AI Festival, she is re-envisioning the future of storytelling,
  interactive entertainment, and digital personas. As the Editor-in-Chief and
  founder of Hyperfiction Magazine, and with the Bruce Ryder Show now in
  partnership with GenFlix, she draws on 20 years of experience in consumer
  psychology, branding, and media to explore how generative AI enables
  audiences to co-create stories, rather than just consume them.
