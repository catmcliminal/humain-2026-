description: >-
  BytePlus (ByteDance, TikTok) is one of the few companies building both
  engines of the modern creative economy: content production, and the
  algorithm that decides what gets seen. On the creation side, models like
  Seedance now turn a product photo into a brand-consistent commercial in a
  single pass. On the distribution side, the interest graph behind TikTok
  directs attention across tens of millions of new videos a day. The
  perspective reveals something much of the debate misses: when everyone can
  make anything, abundance doesn't raise the ceiling; it makes the scarce
  resource — creativity and originality — more valuable. James Caldwell will
  draw insights from ByteDance's data, demonstrating how the feed rewards
  human engagement and authentic work over volume and AI filler. This keynote
  makes the case from inside the machine: scale and speed are now table
  stakes, and judgment, taste and soul become the competitive edge for
  brands, creators and platforms.
