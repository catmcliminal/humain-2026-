bio: >-
  Joana Barros is a senior marketing executive who has been building brands and
  driving commercial outcomes across listed and high-growth digital-first
  businesses for more than two decades.


  She has held global and regional leadership roles in e-commerce, travel tech
  and consumer lifestyle spanning Temple & Webster, Expedia, Orbitz Worldwide
  and TouchNote. Joana has built a reputation for developing modern marketing
  systems that integrate brand and growth, powered by creativity and marketing
  science. Most recently as Chief Marketing Officer at Temple & Webster, she led
  marketing through the company’s growth into the ASX200.


  Joana brings an operator’s perspective on how AI is reshaping marketing drawn
  from leading brands and digital businesses through transformation and scale.
