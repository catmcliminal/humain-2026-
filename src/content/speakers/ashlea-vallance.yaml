name: Ashlea Vallance
role: Founder, Screen Swap by The Screenery
photo: /images/speakers/ashlea-vallance/photo.jpg
bio: >-
  Ashlea Vallance is a marketing director and creative strategist with two
  decades of experience across tech, consumer electronics, and the creative
  industries. A recent graduate of an AI product management certification, she
  founded Screen Swap as a direct response to one of the defining tensions of
  our time: as AI reshapes what creativity means, the things only humans can
  make, by hand, imperfectly, together, matter more than ever. At humAIn, she
  invites participants to swap their digital screen for a printmaking screen
  and make something real with their hands.
