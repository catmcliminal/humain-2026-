bio: >-
  Stu loves learning, spotting patterns and joining dots - something he gets to
  do every day as Chief Strategy Officer at Herd MSL.


  Working to support some of Australia's best-known brands, Stu helps
  organisations earn their place through earned-first communication that drives
  relevance and reputation, and creates commercial impact.


  Stu recently helped launch Elevate, Herd MSL's AI search offering, designed to
  help brands earn visibility, trust and recommendation in an AI-first world
  through expertise from across Herd MSL and Publicis Groupe.
