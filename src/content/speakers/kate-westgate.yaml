name: Kate Westgate
role: Head of Marketing for Home Care, Unilever ANZ
photo: /images/speakers/kate-westgate/photo.jpg
bio: >-
  Kate Westgate is Head of Marketing for Home Care at Unilever ANZ, leading
  brands including OMO, Surf, Comfort and Persil. With more than 12 years of
  experience at Unilever working across Beauty, Personal Care and Home Care,
  she has worked on iconic brands including Dove, Lynx, Vaseline, and TRESemme,
  driving growth through innovation, brand building, and strategic
  partnerships. Kate is passionate about developing people, building
  high-performing teams, and creating marketing that delivers meaningful
  consumer and business impact.
