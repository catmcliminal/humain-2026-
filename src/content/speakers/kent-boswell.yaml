name: Kent Boswell
role: Co-Founder, Head of Production, AiCandy
photo: /images/speakers/kent-boswell/photo.jpg
bio: >-
  With over 20 years across advertising, television, and film, Kent has led
  high-end productions at the intersection of storytelling and craft, partnering
  with leading global agencies to deliver award-winning work across multiple
  platforms.

  His career spans three continents and a wide range of formats, consistently
  exploring new ways to bring ambitious ideas to life. He is now focused on the
  future of AI film production, helping define a new model of filmmaking where
  emerging tools are used to unlock ideas that were previously impossible to
  make while maintaining the highest standards of cinematic craft.

  He has also served on international award juries including Cannes Lions,
  London International Awards, Effie Awards, Adfest, The Webby's, New York
  Festivals, and Spikes Asia, where he was Jury President.
