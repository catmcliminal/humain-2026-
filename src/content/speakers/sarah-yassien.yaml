name: Sarah Yassien
role: Strategist and Founder, deliberate ai
photo: /images/speakers/sarah-yassien/photo.jpg
bio: >-
  Sarah Yassien is a Sydney-based AI strategy executive and founder of
  deliberate ai, an advisory practice helping mission-driven, not-for-profit
  and regulated organisations move from AI experimentation to responsible,
  value-generating adoption. Her career has been defined by leading
  organisations through existential industry shifts — rebuilding operating
  models, platforms and audience relationships at the BBC, Amnesty
  International and SBS, where she served as Executive Director Corporate
  Strategy overseeing growth to 14 million registered users on SBS On Demand,
  while also leading the organisation to be recognised among the AFR's most
  innovative companies in 2021 and 2023.

  Sarah now advises boards and executive teams on AI governance, value
  realisation and responsible deployment, with particular focus on ensuring AI
  tools don't outpace organisational readiness. She is Chair of the Technology
  Committee at Cerebral Palsy Alliance, and brings a long-standing commitment
  to inclusive, community-grounded approaches to technology adoption. She
  joins humAIn's advisory panel to bring an inclusive and value-realisation
  lens to the conversation between media, marketing and AI.
