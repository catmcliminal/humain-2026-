bio: >-
  For over 22 years, Sam has dedicated her media career to driving industry
  change and unlocking growth for the world’s leading brands through innovation
  across media, technology and culture.

  With experience spanning Europe and APAC, Sam leads Mindshare Australia’s
  National Invention and Inclusive Innovation division, where her work has
  achieved global recognition and earned her a place on the AdNews Top 10 Power
  List for Industry Changemakers. Sam represents WPP as a member of the
  Unstereotype Alliance.
