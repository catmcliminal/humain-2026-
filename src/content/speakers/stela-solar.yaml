bio: >-
  Stela Solar is the CEO of Stone & Chalk, Australia's largest innovation
  community. Stela also serves on the Data & AI Advisory Council at Beyond
  Blue. A recognised technology leader, she was previously Managing Director
  for Data&AI at Accenture ANZ, served as the Inaugural Director of
  Australia's National AI Centre and Co-chair of the Commonwealth AI
  Consortium, after holding several leadership positions at Microsoft,
  including Global Director of AI Solution Sales and Global Partner Co-sell
  Leader. Throughout her distinguished 20 year career, she has driven
  business model transformations that enable organisations to capture new
  opportunities through emerging technologies including Cloud, IoT, and AI,
  and has developed nation-wide AI frameworks such as the Voluntary AI Safety
  Standard. Combining her background in sustainability and creative
  industries with deep technical expertise, Stela is known for delivering
  business outcomes anchored in business value, market differentiation and
  responsible impact. Beyond her professional endeavours, Stela enjoys
  sailing and tries to find time to play cello and piano.
