bio: >-
  Aaron Michie is Director, Global Marketing Operations & Strategic Programs at
  Foxtel / DAZN, with over 20 years' experience leading marketing and creative
  transformation. He connects strategy, people and technology to help global
  teams deliver better work at scale, spanning operating model design, AI
  adoption, automation and governance.


  An AI Pioneer with the Australian Centre for AI in Marketing, Aaron focuses on
  practical, responsible AI adoption that delivers commercial value while
  creating more space for meaningful human and creative work.
