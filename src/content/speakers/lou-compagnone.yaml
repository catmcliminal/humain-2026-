name: Lou Compagnone
role: Director of AI, Datacom
photo: /images/speakers/lou-compagnone/photo.jpg
bio: >-
  Lou Compagnone is the Director of AI at Datacom, where she leads the
  company's internal AI transformation and helps enterprises move from just
  adopting AI tools to adapting the way they operate and deliver value. She
  combines experience in emerging technology, strategy, service design, and
  futures thinking to help organisations create, shape, and prepare for their
  AI-driven future.


  For the past two decades, Lou has worked in New Zealand, Australia and the UK
  to solve a diverse range of challenges – from helping citizens access better
  services to helping singles find their someone. With a deep commitment to
  using AI for good, she focuses on creating meaningful solutions that solve
  genuine problems, elevate experiences, and deliver tangible value for both
  businesses and the people they serve.
