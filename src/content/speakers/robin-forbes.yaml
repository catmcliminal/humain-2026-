name: Robin Forbes
role: Global CEO, R/GA
photo: /images/speakers/robin-forbes/photo.jpg
bio: >-
  As the Global CEO, Robin partners with senior clients to help deliver growth
  and change. Robin is the catalyst for R/GA’s global business vision, working
  to ensure the agency continuously strives to deliver transformational work.

  Robin has been with R/GA since 2014. Prior to his current role, he served as
  the Global Chief Client Officer, the EVP Managing Director of R/GA’s Brand
  Design and Consulting practice, and the Managing Director of R/GA’s US Region.

  Prior to that, Robin was the Managing Director of R/GA New York, the agency’s
  largest office, where he was responsible for growth, operations, and new
  business development. Robin originally joined R/GA as an SVP, Group Managing
  Director, leading a multi-disciplinary team focused on building innovative
  work for clients like Verizon, Shopify, Jet.com, and Samsung.

  Before joining R/GA, Robin spent 13 years at Blast Radius, was a consultant at
  Arthur Andersen, and implemented a World Bank initiative in Chile to digitize
  schools and reform the national pedagogy.

  Robin is a graduate of the University of British Columbia where he earned his
  Bachelor of Commerce in international business and the Columbia University
  Business School Executive Education program.
