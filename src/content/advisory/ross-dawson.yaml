bio: 'Ross Dawson works globally as a futurist, board advisor, keynote speaker, and entrepreneur. He is Founding Chairman of the Advanced Human Technologies group of companies, including Humans + AI startup Informivity, and the bestselling author of five books, most recently Thriving on Overload.

  Strong global demand has seen him deliver keynote speeches to business and government leaders in 35 countries, while frequent media appearances include ABC TV, BBC, The Guardian, New York Times, SkyNews, Today and Sunrise shows, VICE, and many others.'
