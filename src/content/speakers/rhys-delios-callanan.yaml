name: Rhys Delios Callanan
role: Senior Creative, We The People
photo: /images/speakers/rhys-delios-callanan/photo.jpg
bio: >-
  Rhys’ creative career technically started in primary school, drawing
  personalised characters for classmates and charging a gold coin a pop. Since
  then, his experience has stretched from traditional advertising campaigns and
  social-first work to emerging AI-led production, with a focus on sharp
  insights, strong ideas, thoughtful craft and finding new ways to bring them
  to life. His ideas have picked up recognition along the way, including AWARD
  GenAI Sprint, Cairns Crocodiles Hatchlings and TBWA Disrupt AI Film Festival.
