description: >-
  Lessons from 1,000 AI projects across 45 countries.


  AI has made it ridiculously easy to make things. One person with a laptop
  can now generate images, write scripts, edit films, build worlds, make
  music and ship work at a speed that felt impossible only a few years ago.
  So, naturally, the industry has fallen hard for the idea of the full-stack
  AI creative. The person who can do it all.


  Yet judging more than 1,000 entries from 45 countries for the AARON Awards
  revealed the opposite. The most compelling work wasn't created by people
  doing everything themselves. It was built on strong creative judgment, deep
  craft and thoughtful collaboration, created by people who knew what good
  looked like before they started touching the tools.


  The session examines what separates world-class AI work from technically
  impressive demos, and how Australia is performing against the rest of the
  world. We'll ask if we're punching above our weight or being left behind,
  and what creatives can do differently.


  And the bigger questions: What does it mean for the way we build creative
  careers and teams? How do juniors learn when the tasks that used to teach
  craft are being automated or skipped? How do we build teams in a world of
  independent artists? And if everyone can make almost anything, what will
  the role of specialists become?


  A data-informed discussion about craft, careers and the capabilities that
  matter most when everyone has access to the same tools.
