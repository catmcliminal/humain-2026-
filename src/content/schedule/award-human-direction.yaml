description: >-
  When generative AI tools are universally accessible, technical execution
  becomes commoditised. The true differentiator of exceptional creative work
  shifts from baseline production to human stewardship: taste, discernment,
  creative leadership, and authorship.


  While the inaugural AWARD Lab GenAI Sprint catalysed the approach for this
  session, the discussion extends far beyond prompt engineering tutorials.
  Using the Sprint as a live case study, this panel brings together leadership
  from AWARD (Australasian Writers and Art Directors) to explore the seismic
  shifts in how work is conceived, mentored, governed, and crafted when AI
  becomes an active collaborator in the creative department.


  The panel includes:


  Mandie van der Merwe, CCO, Saatchi & Saatchi | AWARD Chair


  Hilary Badger, ECD, Leo Australia | AWARD Council Member | AWARD Lab Creative
  Mentor and Judge


  Ross Colebatch, EP, Photoplay Photography | Commercial Producers Council
  Member | AWARD Lab Craft Mentor and Judge


  Rhys Delios Callanan — Winning creative team, inaugural AWARD Lab GenAI
  Sprint
