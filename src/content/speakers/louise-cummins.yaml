bio: >-
  Louise Cummins is CEO and Co-Founder of the Australian Centre for AI in
  Marketing (ACAM). A former CMO at World Vision Australia, she brings over 25
  years’ experience, including senior roles at H&R Block and Optus. Through
  research, education and advisory work, Louise helps leaders connect
  responsible AI adoption to commercial outcomes and prepare marketing teams for
  the future.
