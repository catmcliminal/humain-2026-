name: Oren Fixler
role: External Channels & Media, Telstra
photo: /images/speakers/oren-fixler/photo.jpg
bio: >-
  Oren Fixler leads External Channels & Media at Telstra, where he’s spent years
  helping the brand show up in ways that feel human, useful and occasionally a
  bit fun. He leads the telco’s social, owned and earned media activity.


  Before diving deep into the world of comms and corporate affairs, he started
  out behind a camera, in content production and photojournalism, followed by
  various commercial roles across Telstra’s retail and product development
  groups.


  Along the way, he’s also steered the company’s employee communications, shaped
  its reputation strategy, and plays a lead role in issues and crisis
  management.


  Oren is a graduate of RMIT University’s Entrepreneurship program.
