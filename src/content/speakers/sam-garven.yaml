name: Sam Garven
role: Founder, Hello Canopy
photo: /images/speakers/sam-garven/photo.jpg
bio: >-
  Sam Garven has spent more than a decade building in the Australian tech and
  startup ecosystem. She scaled Zip Co from 130 to 1,300 people globally, was
  one of the earliest hires at a $10M VC-backed startup, and founded a
  nonprofit raising awareness of discrimination and harassment in tech.


  Most recently, Sam founded Hello Canopy, a Techstars backed startup building
  a contextualised insights platform for HR and Operations teams — nominated
  for Best New Idea, with Sam herself recognised as Industry Champion at the
  Best in Tech Awards. She also took the stage at SXSW as a Future of Work
  finalist.


  Today, Sam works as an early stage advisor and consultant, helping founders
  navigate the messy 0–1 and see around the corners of what's coming next.
