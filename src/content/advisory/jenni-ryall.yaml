bio: 'Jenni Ryall, the founder of Other Labs, has two decades of experience working in and with media organisations and technology platforms, including Mashable, TEGNA, Meta and Google. She is currently focused on building collaboration between the news media industry and technology companies to ensure the future of a high-quality content ecosystem.

  Other Labs is a media capability and AI advisory business working with newsrooms, funders and platforms across Australia, New Zealand and the Pacific to shape the future of media through practical AI capability, organisational change and sustainable business models.'
