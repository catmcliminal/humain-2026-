name: Jason Ross
role: Founder and digital innovation leader
photo: /images/speakers/jason-ross/photo.jpg
bio: >-
  Jason Ross is the co-founder of Time Under Tension, Australia’s first
  generative AI experience agency. Jason brings that mix of creative,
  commercial and technology experience to the AI frontier. He works with
  leaders and teams to understand what generative AI makes possible, then
  helps them build the skills and confidence to put it to work. A frequent
  speaker on AI and the future of work, he recently appeared on a Channel 10
  programme discussing the technology and its impact.


  Jason has helped organisations turn emerging technology into better
  experiences for customers and employees for more than 20 years. He ran
  digital agency Reactive before its acquisition by Accenture Interactive,
  where he went on to serve as a Managing Director. He later led frog’s
  business in Australia and New Zealand, before co-founding Time Under
  Tension.
