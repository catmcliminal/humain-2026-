bio: >-
  Aleisha McCall is a Marketing, Media and AI Transformation Strategist,
  industry keynote speaker, multi-award winner, and a ten-time recipient of the
  B&T Women in Media Power List. She is also the host of The Black Box of Media
  podcast, where she lifts the lid on the hidden strategies behind
  high-performance media advertising, interviewing marketing leaders, media
  experts, and brand executives to uncover the tactics that consistently deliver
  market-beating results.


  As Founder & CEO of Ultimate Edge Communications, Aleisha helps organisations
  redesign their marketing and media advertising operating models for the AI
  era. Over the past two decades, she has led more than $100 million in
  marketing investment, generating over $500 million in client revenue and more
  than 1 million leads. She works with senior executives and their teams to
  eliminate fragmented marketing practices, integrate AI into commercial
  operations, and deliver measurable, high-ROI business outcomes.
