bio: >
  Matt Jones is obsessed with both the transformative impact of technology and
  the strategic power of story. He’s a former political speechwriter turned
  brand strategist who co-founded and sold Australia’s leading spirits business,
  Four Pillars Gin. Today, Matt is a creative strategist, keynote speaker,
  writer, host of the podcast StoryWork and founder of the strategic advisory
  firm Think Story Experience. Matt is also the author of Lessons From Gin. You
  can follow all Matt’s writing, podcasting and work at matt-jones.com.au
