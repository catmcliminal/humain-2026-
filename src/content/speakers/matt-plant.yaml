bio: >-
  Matt Plant is Thinkerbell's Head of Behavioural Science and Ai. Matt has
  brought the worlds of Behavioural Science (sociology, anthropology,
  neuroscience, psychology and behavioural economics) to national and
  international brands to solve a host of challenging human problems.
  Including: researching the values of the Australian Psyche, international
  behaviour change projects across airport operations, and positioning an
  organisation creating a new approach to scientific research. Matt's
  experience spans research, brand and comms strategy, CX strategy and
  behaviour change and now the world of Ai.
