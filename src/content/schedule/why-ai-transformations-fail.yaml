description: >-
  So many AI talks focus on what the technology can do, but ignore what
  organisations need to do to make it work.


  As Datacom’s Director of AI, Lou Compagnone has stood up more than ninety AI
  tools inside a large business and seen first-hand why some take hold while
  others stall or are rejected. Often, the reasons have less to do with the
  technology than with the organisation around it: roles, workflows,
  decision-making, incentives and trust.


  Her argument is that successful AI adoption is an organisational design
  challenge as much as a technology one. The companies making real progress are
  rethinking how work happens, not simply adding new tools to existing
  structures.


  Fresh from a Stanford programme with eighty global executives grappling with
  many of the same questions, Lou will share what she has learned from the
  deployments that worked, the ones that didn’t, and what leaders are wrestling
  with behind closed doors.
