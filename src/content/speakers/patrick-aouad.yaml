bio: >-
  Dr Patrick Aouad is an internationally published specialist neurologist and
  the founder and CEO of CU Health, Australia's leading health and wellbeing
  platform for employees. CU Health was developed to support the increasing
  demand on employees, and to protect organisations from the negative impact
  employee mental and physical health can have on culture, performance and
  engagement.

  CU Health was recently unveiled as Australia's and NZ's first complete health
  and wellbeing solution for businesses. Powered by technology, with humans at
  the centre, it is the "how" to a $200 billion economic problem in Australia
  alone.

  Patrick is passionate about improving health outcomes for people through
  human-centred technology, and is Australia's leading voice on workplace
  wellbeing and its economic impacts in an era of rapid technological and
  social change.
