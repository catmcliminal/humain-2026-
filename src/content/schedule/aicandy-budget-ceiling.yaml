description: >-
  The optimistic case, argued without hedging. AiCandy build things that could
  not have been made at any budget a brand would sign off three years ago.


  Kent Boswell brings the commercial evidence: what a named job cost, what it
  would have cost, and what got made that otherwise would not have.


  This is the counterweight. The rest of the programme argues that taste is the
  scarce resource. This session argues that access is the point, and then takes
  questions from people who disagree.
